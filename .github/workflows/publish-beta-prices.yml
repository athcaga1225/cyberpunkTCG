name: Publish complete Beta prices
on:
  push:
    paths:
      - '.github/workflows/publish-beta-prices.yml'
      - 'scripts/update-beta-prices.py'
  workflow_dispatch:
  schedule:
    # Daily at 09:00 Asia/Taipei (01:00 UTC); GitHub may start late.
    - cron: '0 1 * * *'
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Verify every Beta price, card name, rarity and date
        run: python scripts/update-beta-prices.py
      - name: Publish verified Beta price data
        run: |
          git add prices.json
          if ! git diff --cached --quiet -- prices.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh complete 172-card Beta market price guide"
            git push
          else
            echo "No changes to price guide"
          fi
