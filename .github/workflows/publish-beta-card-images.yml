name: Publish Beta card images
on:
  push:
    paths:
      - '.github/workflows/publish-beta-card-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and generate card image catalog
        run: node scripts/update-beta-images.mjs
      - name: Commit image URL catalog
        run: |
          if ! git diff --quiet -- card-images.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add card-images.json
            git commit -m "data: publish verified Beta card image URLs"
            git push
          else
            echo "No change in card image list"
          fi
